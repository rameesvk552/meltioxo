server {
    listen 80;
    listen 443 ssl;
    server_name perfume.wayon.in;

    ssl_certificate /etc/letsencrypt/live/perfume.wayon.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perfume.wayon.in/privkey.pem;

    # A 5 MB image becomes about 6.7 MB when sent as a base64 data URL.
    client_max_body_size 8m;

    root /mnt/recovery/perfume-erp/app/client/dist;
    index index.html;

    # Always revalidate the app shell so it points browsers to the latest
    # hash-named JavaScript and CSS files after each deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Browsers must revalidate the PWA entry points on every update check.
    # The hash-named application assets remain immutable below.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~ ^/workbox-[a-zA-Z0-9_-]+\.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
